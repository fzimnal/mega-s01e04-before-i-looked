# Plan morning-digest § 3 and § 4. Publishes one self-contained HTML copy of a digest page to
# GitHub Pages as a Pages artifact. The HTML is never committed: previews stay out of the repo
# (ADR 0003). Run with marker=true for the review copy, then marker=false to upload over the same
# link with LANE_MARKER unset ("no marker set").
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview (YYYY-MM-DD)
        default: '2026-10-28'
        required: true
      marker:
        description: Include the lane marker (false = clean-up copy)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Save the page as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf "localhost:8787/digest/${{ inputs.night }}" -o _site/index.html
          grep -c '<table' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
